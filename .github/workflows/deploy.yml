name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: gameops-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ap-northeast-2
      PROJECT_NAME: gameops-platform-lab
      ENVIRONMENT: portfolio
    steps:
      - name: Check out the exact verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Build and publish immutable image
        env:
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/game-session-api:${DEPLOY_SHA}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker build \
            --label "org.opencontainers.image.revision=${DEPLOY_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${image}" .
          docker push "${image}"
          echo "IMAGE_REF=${image}" >>"${GITHUB_ENV}"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Select exactly one deployment target
        shell: bash
        run: |
          mapfile -t instances < <(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=${PROJECT_NAME}" \
              "Name=tag:Environment,Values=${ENVIRONMENT}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text | tr '\t' '\n' | sed '/^$/d')
          if [[ "${#instances[@]}" -ne 1 ]]; then
            echo "expected exactly one running deployment target, found ${#instances[@]}" >&2
            exit 1
          fi
          echo "INSTANCE_ID=${instances[0]}" >>"${GITHUB_ENV}"

      - name: Deploy through Systems Manager
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          remote_script="set -euo pipefail; install -d -m 0755 /opt/gameops; if [[ ! -d /opt/gameops/repository/.git ]]; then git clone '${repo_url}' /opt/gameops/repository; fi; bash /opt/gameops/repository/scripts/deploy_on_instance.sh '${repo_url}' '${DEPLOY_SHA}' '${IMAGE_REF}'"
          remote_command="bash -lc $(printf '%q' "${remote_script}")"
          jq -n --arg command "${remote_command}" '{commands: [$command]}' >ssm-parameters.json
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${DEPLOY_SHA}" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' --output text)"
          set +e
          aws ssm wait command-executed --command-id "${command_id}" --instance-id "${INSTANCE_ID}"
          wait_status=$?
          set -e
          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
          exit "${wait_status}"
