name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.17

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Lint and test
        run: make verify

      - name: Validate optional infrastructure paths
        shell: bash
        run: |
          if [[ -d infra/terraform ]]; then
            terraform -chdir=infra/terraform fmt -check -recursive
            terraform -chdir=infra/terraform init -backend=false
            terraform -chdir=infra/terraform validate
            terraform -chdir=infra/terraform test
          fi
          if [[ -d k8s/base ]]; then
            kubectl kustomize k8s/base >/tmp/gameops-rendered.yaml
          fi

  manifests:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.17
          uv sync --frozen

      - name: Test rendered manifest policies
        run: uv run pytest tests/kubernetes -v

      - name: Validate monitoring configuration and scripts
        run: |
          uv run pytest tests/monitoring -v
          shellcheck scripts/install_observability.sh scripts/deploy_on_instance.sh scripts/rollback.sh

      - name: Validate load and incident experiments
        run: |
          uv run pytest tests/loadtest -v
          bash scripts/validate_load_tests.sh
          shellcheck scripts/inject_fault.sh scripts/validate_load_tests.sh

      - name: Validate Kubernetes schemas
        run: >-
          kubectl kustomize k8s/base |
          docker run --rm --interactive ghcr.io/yannh/kubeconform:v0.8.0
          -strict -summary -ignore-missing-schemas

  container-security:
    needs: [quality, manifests]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test application image contract
        run: bash tests/container/test_container.sh

      - name: Export image for isolated scanning
        run: docker save --output gameops-api-test.tar gameops-api:test

      - name: Scan image for critical vulnerabilities
        run: >-
          docker run --rm
          -v "${PWD}:/scan:ro"
          aquasec/trivy:0.74.0 image
          --input /scan/gameops-api-test.tar
          --exit-code 1 --ignore-unfixed --severity CRITICAL --scanners vuln

      - name: Scan repository history for secrets
        run: >-
          docker run --rm
          -v "${PWD}:/repo"
          zricethezav/gitleaks:v8.30.1 detect
          --source=/repo --no-banner --redact

      - name: Lint workflow definitions
        run: >-
          docker run --rm
          -v "${PWD}:/repo"
          --workdir /repo
          rhysd/actionlint:1.7.12 -color
