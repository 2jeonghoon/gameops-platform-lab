[project]
name = "gameops-platform-lab"
version = "0.1.0"
description = "A small game-session API for a documented DevOps platform lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv]
package = false
